# File: .github/workflows/test.yml
name: Tests
on:
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Default GITHUB_TOKEN permissions are read-only on many repos —
    # pull-requests: write is what lets the coverage step below post its
    # PR comment with that same automatic token (no separate secret).
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js ⚙️ - Cache dependencies ⚡ - Install dependencies 🔧
        uses: ./.github/workflows/setup-node

      - name: Generate Prisma client 🔧
        # backend/api/crosslex's tests import the generated client directly;
        # it's gitignored codegen output, never committed, so a fresh
        # checkout needs this before anything there can even load. `generate`
        # only reads the schema — it never connects to the database — so a
        # placeholder DATABASE_URL is enough.
        run: cd website && DATABASE_URL="postgresql://user:pass@localhost:5432/db" yarn workspace @whitelotus/back-api-crosslex exec prisma generate

      - name: Run tests with coverage 🧪
        # Appends --coverage to each workspace's own `test` script rather
        # than switching to `test:ci` — the backend's `test:ci` has
        # different semantics (runs e2e too, needs `migrate:test-db`
        # against a live Postgres this job doesn't provision), while its
        # `test` script (`jest --selectProjects unit`) is already correctly
        # scoped for a DB-less CI run. `workspaces foreach ... run test`
        # passes trailing args straight through to each package's script,
        # so this becomes `jest --coverage` for frontend packages and
        # `jest --selectProjects unit --coverage` for the backend.
        run: cd website && yarn workspaces foreach --worktree --parallel run test --coverage

      - name: Report coverage 📊
        # Self-hosted (getsentry/coverage-action): no external account,
        # dashboard, or token to set up — GITHUB_TOKEN is already provided
        # automatically by Actions, and results are stored as a GitHub
        # Artifact rather than sent to a third-party service.
        # `directory: website` auto-discovers every workspace's
        # coverage/lcov.info (or coverage-final.json) in one pass and
        # compares the combined total against the base branch. No JUnit
        # XML is produced anywhere in this repo, so enable-tests is off —
        # coverage only. `if: always()` so a result still posts even if a
        # test step failed (jest writes its coverage report regardless of
        # pass/fail).
        if: always()
        uses: getsentry/coverage-action@0.3.8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          directory: website
          enable-tests: false
          post-pr-comment: true
          fail-ci-if-error: false
